<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2b5cff">
<title>English Master · 英语五项全能学习</title>
<link rel="stylesheet" href="css/style.css?v=20261110f">
</head>
<body>
<div id="app">
  <!-- 顶部栏 -->
  <header class="topbar">
    <div class="topbar-title">
      <span class="logo">🎓</span>
      <div>
        <h1 id="view-title">学习总览</h1>
        <p class="subtitle" id="view-subtitle">English Master · 五项全能</p>
      </div>
    </div>
    <div style="display:flex;gap:6px">
      <button class="streak on" id="zh-toggle" title="中文释义显示开关（影响单词卡/听力字幕/口语句子）">中文 开</button>
      <div class="streak" id="streak-box" title="连续学习天数">🔥 <b id="streak-num">0</b> 天</div>
    </div>
  </header>

  <!-- 主内容区 -->
  <main id="main" class="main"></main>

  <!-- 底部导航（移动端友好） -->
  <nav class="tabbar" id="tabbar">
    <a href="#/dashboard" data-view="dashboard" class="tab active"><span class="tab-icon">📊</span><span class="tab-label">总览</span></a>
    <a href="#/words" data-view="words" class="tab"><span class="tab-icon">📖</span><span class="tab-label">单词</span></a>
    <a href="#/listening" data-view="listening" class="tab"><span class="tab-icon">🎧</span><span class="tab-label">听力</span></a>
    <a href="#/grammar" data-view="grammar" class="tab"><span class="tab-icon">✏️</span><span class="tab-label">语法</span></a>
    <a href="#/speaking" data-view="speaking" class="tab"><span class="tab-icon">🎤</span><span class="tab-label">口语</span></a>
    <a href="#/reading" data-view="reading" class="tab"><span class="tab-icon">📚</span><span class="tab-label">阅读</span></a>
    <a href="#/report" data-view="report" class="tab"><span class="tab-icon">🎯</span><span class="tab-label">画像</span></a>
  </nav>
</div>

<!-- 全局轻提示 -->
<div id="toast" class="toast"></div>

<script src="js/data-words.js?v=20261110f"></script>
<script src="js/data-listening.js?v=20261110f"></script>
<script src="js/data-grammar.js?v=20261110f"></script>
<script src="js/data-speaking.js?v=20261110f"></script>
<script src="js/data-reading.js?v=20261110f"></script>
<script src="js/app.js?v=20261110f"></script>
</body>
</html>
